[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = espidf
monitor_speed = 115200
check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,performance,portability --inline-suppr --suppress=unusedFunction --max-configs=1

[env:native]
platform = native
test_build_src = true
build_flags = -D UNIT_TEST
build_src_filter = +<alarm.cpp> +<system_state.cpp>